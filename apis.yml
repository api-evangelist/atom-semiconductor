name: Atom Semiconductor
description: >-
  Atom Semiconductor (Atom Semiconductor Technologies Limited) is a fabless
  mixed-signal chip design company founded in Hong Kong in October 2020, with
  offices in Shenzhen and Shanghai. It designs high-performance analog and
  mixed-signal semiconductors for consumer and industrial IoT systems across
  three product lines: digital sensor chips (temperature/humidity, pressure,
  optical), analog-to-digital converters (24-bit Sigma-Delta, high-precision
  SAR, and high-speed GSPS ADCs), and microprocessors. Its first product, the
  AS1412 24-bit Sigma-Delta ADC, shipped for customer trials in late 2021. The
  company raised roughly 100M yuan in a pre-A round led by Qiming Venture
  Partners (with Venus Medtech and Alibaba Entrepreneurs Fund) and was named to
  the Forbes Asia 100 To Watch 2022. It is a hardware chip designer and does not
  publish a developer API, SDK, or developer portal.
